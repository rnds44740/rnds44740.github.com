<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MZP — Zone du Paraclet</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f4ee;
      color: #241a33;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border: 1px solid #e7dfcb;
      border-radius: 20px;
      padding: 40px 52px;
      box-shadow: 0 10px 30px rgba(36,26,51,0.08);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      color: #3d2361;
    }
    .sub {
      margin-top: 10px;
      color: #5b5266;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>MZP</h1>
    <div class="sub">Zone du Paraclet</div>
  </div>
</body>
</html>
